<!DOCTYPE html>
<html lang="ta">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Oru Varthai - Tamil Charades</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700;900&family=Noto+Sans+Tamil:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Public Sans', 'Noto Sans Tamil', sans-serif; background: #000; color: #fff; -webkit-tap-highlight-color: transparent; }
        .screen { display: none; height: 100vh; width: 100%; padding: 30px; flex-direction: column; overflow: hidden; align-items: center; justify-content: center; }
        .screen.active { display: flex; }
        .card-shadow { box-shadow: 0 30px 60px rgba(0,0,0,0.5); }
        .category-container { width: 100%; max-width: 400px; max-height: 70vh; overflow-y: auto; padding: 12px; -webkit-overflow-scrolling: touch; }
        .category-container::-webkit-scrollbar { display: none; }
        .word-pop { animation: pop 0.45s cubic-bezier(0.19, 1, 0.22, 1); }
        @keyframes pop { from { opacity: 0; transform: scale(0.92) translateY(12px); } to { opacity: 1; transform: scale(1) translateY(0); } }
        .btn-active:active { transform: scale(0.94); background: #1a1a1a; }
        .correct-bg { background-color: #064e3b !important; transition: background-color 0.2s; }
        .pass-bg { background-color: #7f1d1d !important; transition: background-color 0.2s; }
    </style>
</head>
<body class="overflow-hidden bg-black text-white">

    <!-- HOME SCREEN -->
    <div id="screen-home" class="screen active text-center bg-black">
        <div class="mb-14">
            <h1 class="text-7xl font-[900] tracking-tighter mb-3 text-white">ஒரு வார்த்தை</h1>
            <p class="text-gray-500 text-[10px] font-black tracking-[0.6em] uppercase">ORU VARTHAI</p>
        </div>
        
        <div class="category-container space-y-4" id="category-list">
            <!-- Categories injected here -->
        </div>
    </div>

    <!-- GAMEPLAY SCREEN -->
    <div id="screen-game" class="screen py-14 bg-black">
        <div class="w-full max-w-md flex justify-between items-center px-6 absolute top-10">
            <button onclick="confirmQuit()" class="text-gray-600 font-black text-xs tracking-widest uppercase">QUIT</button>
            <div class="text-white font-black w-10 text-right text-3xl tabular-nums" id="game-score">0</div>
        </div>

        <div class="text-center px-8 flex flex-col justify-center items-center w-full max-w-2xl" id="game-swipe-area">
            <div id="timer-pill" class="text-base font-black tracking-[0.4em] text-gray-700 mb-12 tabular-nums">00:60</div>
            
            <div id="card-content" class="word-pop space-y-8 w-full">
                <h2 id="word-tamil" class="text-7xl font-black leading-[1.15] text-white">...</h2>
                <div class="space-y-4">
                    <p id="word-phonetic" class="text-2xl font-bold text-gray-400 italic tracking-tight"></p>
                    <p id="word-meaning" class="text-base text-gray-500 font-medium px-4 md:px-12 leading-relaxed"></p>
                </div>
            </div>
        </div>
        
        <div class="w-full max-w-md grid grid-cols-2 gap-5 px-6 pb-6 absolute bottom-10">
            <button onclick="handleAction('pass')" class="py-7 bg-red-950/30 text-red-500 rounded-[35px] font-black text-2xl active:scale-95 transition-transform uppercase tracking-tighter border border-red-900/50">
                PASS
            </button>
            <button onclick="handleAction('correct')" class="py-7 bg-green-950/30 text-green-500 rounded-[35px] font-black text-2xl shadow-sm active:scale-95 transition-transform uppercase tracking-tighter border border-green-900/50">
                GOT IT
            </button>
        </div>
    </div>

    <!-- RESULTS SCREEN -->
    <div id="screen-results" class="screen justify-center items-center text-center bg-black">
        <div class="bg-gray-900/50 p-16 rounded-[60px] w-full max-w-sm border border-gray-800 card-shadow">
            <h2 class="text-gray-600 font-black mb-4 uppercase tracking-widest text-[12px]">Round Score</h2>
            <div class="text-[10rem] font-black text-white leading-none mb-16 tracking-tighter" id="final-score">0</div>
            
            <button onclick="showScreen('home')" class="w-full py-7 bg-white text-black font-black rounded-[35px] text-2xl mb-8 active:scale-95 transition-transform uppercase tracking-tighter">
                CONTINUE
            </button>
            <button onclick="shareScore()" class="w-full py-2 bg-transparent text-gray-500 rounded-2xl font-black text-[10px] uppercase tracking-[0.25em]">
                Share Result
            </button>
        </div>
    </div>

    <script>
        let categories = {};
        let currentWords = [];
        let score = 0;
        let timer = 60;
        let timerInterval;

        const loadGame = async () => {
            try {
                const response = await fetch('data/master_pack.json');
                if (!response.ok) throw new Error('Master pack not found');
                categories = await response.json();
                renderCategories();
            } catch (e) {
                console.error('Loading fallback content', e);
                // Simple fallback if fetch fails
                categories = {
                    "🎬 Movies (திரைப்படங்கள்)": [["பாட்ஷா", "Baasha", "Legendary gangster movie"]],
                    "🎵 Songs (பாடல்கள்)": [["வாத்தி கமிங்", "Vaathi Coming", "Viral party anthem"]]
                };
                renderCategories();
            }
        };

        const renderCategories = () => {
            const list = document.getElementById('category-list');
            list.innerHTML = '';
            Object.keys(categories).forEach(cat => {
                const btn = document.createElement('button');
                btn.className = "w-full py-6 px-10 bg-gray-900/50 border border-gray-800 hover:bg-gray-800 rounded-[35px] text-center font-black text-xl transition-all active:scale-95 btn-active uppercase tracking-tight mb-4 text-white";
                btn.innerText = cat.split(' (')[0]; // Show emoji + English name
                btn.onclick = () => startGame(cat);
                list.appendChild(btn);
            });
        };

        const showScreen = (id) => {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById('screen-' + id).classList.add('active');
        };

        const startGame = (cat) => {
            currentWords = [...categories[cat]].sort(() => Math.random() - 0.5);
            score = 0;
            timer = 60;
            document.getElementById('game-score').innerText = score;
            nextWord();
            showScreen('game');
            startTimer();
        };

        const nextWord = () => {
            if (currentWords.length === 0) { endGame(); return; }
            const [tamil, phonetic, meaning] = currentWords.pop();
            const container = document.getElementById('card-content');
            container.classList.remove('word-pop');
            void container.offsetWidth; 
            document.getElementById('word-tamil').innerText = tamil;
            document.getElementById('word-phonetic').innerText = phonetic;
            document.getElementById('word-meaning').innerText = meaning;
            container.classList.add('word-pop');
        };

        const flashBackground = (className) => {
            const screen = document.getElementById('screen-game');
            screen.classList.add(className);
            setTimeout(() => screen.classList.remove(className), 150);
        };

        const handleAction = (type) => {
            if (type === 'correct') {
                score++;
                document.getElementById('game-score').innerText = score;
                flashBackground('correct-bg');
                if (navigator.vibrate) navigator.vibrate(40);
            } else {
                flashBackground('pass-bg');
                if (navigator.vibrate) navigator.vibrate([20, 30, 20]);
            }
            nextWord();
        };

        const startTimer = () => {
            updateTimerDisplay();
            timerInterval = setInterval(() => {
                timer--;
                updateTimerDisplay();
                if (timer <= 0) endGame();
            }, 1000);
        };

        const updateTimerDisplay = () => {
            const pill = document.getElementById('timer-pill');
            pill.innerText = `00:${timer.toString().padStart(2, '0')}`;
            if (timer <= 10) {
                pill.classList.remove('text-gray-700');
                pill.classList.add('text-red-500');
            } else {
                pill.classList.remove('text-red-500');
                pill.classList.add('text-gray-700');
            }
        };

        const confirmQuit = () => {
            if (confirm("End this round early?")) {
                clearInterval(timerInterval);
                showScreen('home');
            }
        };

        const endGame = () => {
            clearInterval(timerInterval);
            document.getElementById('final-score').innerText = score;
            showScreen('results');
        };

        const shareScore = () => {
            const text = `I just scored ${score} on Oru Varthai! 🎭✨`;
            if (navigator.share) navigator.share({ text: text });
        };

        loadGame();
    </script>
</body>
</html>
</body>
</html>
