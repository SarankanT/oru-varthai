<!DOCTYPE html>
<html lang="ta">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Oru Varthai - Tamil Charades</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700;900&family=Noto+Sans+Tamil:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #000;
            --text-main: #fff;
            --text-dim: #666;
            --text-accent: #9ca3af;
            --card-bg: rgba(17, 24, 39, 0.5);
            --card-border: rgba(31, 41, 55, 0.5);
            --btn-hover: #1a1a1a;
            --shadow: rgba(0,0,0,0.5);
            --timer-color: #374151;
        }
        .light-mode {
            --bg-color: #f9fafb;
            --text-main: #000;
            --text-dim: #9ca3af;
            --text-accent: #4b5563;
            --card-bg: #fff;
            --card-border: #f3f4f6;
            --btn-hover: #f3f4f6;
            --shadow: rgba(0,0,0,0.06);
            --timer-color: #e5e7eb;
        }
        body { 
            font-family: 'Public Sans', 'Noto Sans Tamil', sans-serif; 
            background: var(--bg-color); 
            color: var(--text-main); 
            -webkit-tap-highlight-color: transparent; 
            transition: background 0.3s, color 0.3s;
            margin: 0;
            padding: 0;
            overscroll-behavior: none;
        }
        .screen { 
            display: none; 
            height: 100vh; 
            height: -webkit-fill-available;
            width: 100%; 
            padding: 20px; 
            flex-direction: column; 
            overflow: hidden; 
            align-items: center; 
            justify-content: center;
            box-sizing: border-box;
        }
        .screen.active { display: flex; }
        .card-shadow { box-shadow: 0 30px 60px var(--shadow); }
        .category-container { 
            width: 100%; 
            max-width: 400px; 
            max-height: 60vh; 
            overflow-y: auto; 
            padding: 10px; 
            -webkit-overflow-scrolling: touch; 
        }
        .category-container::-webkit-scrollbar { display: none; }
        .word-pop { animation: pop 0.45s cubic-bezier(0.19, 1, 0.22, 1); }
        @keyframes pop { from { opacity: 0; transform: scale(0.92) translateY(12px); } to { opacity: 1; transform: scale(1) translateY(0); } }
        .btn-active:active { transform: scale(0.96); background: var(--btn-hover); }
        .correct-bg { background-color: #064e3b44 !important; transition: background-color 0.2s; }
        .pass-bg { background-color: #7f1d1d44 !important; transition: background-color 0.2s; }
        .theme-toggle { position: absolute; top: 15px; right: 15px; z-index: 50; cursor: pointer; padding: 10px; opacity: 0.6; }
    </style>
</head>
<body class="overflow-hidden bg-black text-white">

    <button onclick="toggleTheme()" class="theme-toggle" id="theme-btn">
        <svg id="sun-icon" class="hidden w-6 h-6 text-black" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364-6.364l-.707.707M6.343 17.657l-.707.707m12.728 0l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707-.707M12 8a4 4 0 110 8 4 4 0 010-8z"></path></svg>
        <svg id="moon-icon" class="w-6 h-6 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"></path></svg>
    </button>

    <!-- HOME SCREEN -->
    <div id="screen-home" class="screen active text-center">
        <div class="mb-10">
            <h1 class="text-5xl md:text-7xl font-[900] tracking-tighter mb-2" style="color: var(--text-main)">ஒரு வார்த்தை</h1>
            <p class="text-[9px] font-black tracking-[0.6em] uppercase" style="color: var(--text-dim)">ORU VARTHAI</p>
        </div>
        
        <div class="category-container space-y-3" id="category-list">
            <!-- Categories injected here -->
        </div>
    </div>

    <!-- GAMEPLAY SCREEN -->
    <div id="screen-game" class="screen py-8">
        <div class="w-full max-w-md flex justify-between items-center px-6 absolute top-6">
            <button onclick="confirmQuit()" class="font-black text-xs tracking-widest uppercase p-2" style="color: var(--text-dim)">QUIT</button>
            <div class="font-black w-10 text-right text-3xl tabular-nums" style="color: var(--text-main)" id="game-score">0</div>
        </div>

        <div class="text-center px-4 flex flex-col justify-center items-center w-full max-w-2xl" id="game-swipe-area">
            <div id="timer-pill" class="text-sm font-black tracking-[0.4em] mb-8 tabular-nums" style="color: var(--timer-color)">00:60</div>
            
            <div id="card-content" class="word-pop space-y-6 w-full">
                <h2 id="word-tamil" class="text-5xl md:text-7xl font-black leading-tight" style="color: var(--text-main)">...</h2>
                <div class="space-y-3">
                    <p id="word-phonetic" class="text-xl md:text-2xl font-bold italic tracking-tight" style="color: var(--text-accent)"></p>
                    <p id="word-meaning" class="text-sm md:text-base font-medium px-4 md:px-12 leading-relaxed" style="color: var(--text-dim)"></p>
                </div>
            </div>
        </div>
        
        <div class="w-full max-w-md grid grid-cols-2 gap-4 px-6 pb-6 absolute bottom-6">
            <button onclick="handleAction('pass')" class="py-5 md:py-7 bg-red-950/30 text-red-500 rounded-[30px] font-black text-xl md:text-2xl active:scale-95 transition-transform uppercase tracking-tighter border border-red-900/50">
                PASS
            </button>
            <button onclick="handleAction('correct')" class="py-5 md:py-7 bg-green-950/30 text-green-500 rounded-[30px] font-black text-xl md:text-2xl shadow-sm active:scale-95 transition-transform uppercase tracking-tighter border border-green-900/50">
                GOT IT
            </button>
        </div>
    </div>

    <!-- RESULTS SCREEN -->
    <div id="screen-results" class="screen justify-center items-center text-center">
        <div class="p-10 md:p-16 rounded-[50px] w-full max-w-[340px] border card-shadow" style="background: var(--card-bg); border-color: var(--card-border)">
            <h2 class="font-black mb-4 uppercase tracking-widest text-[10px]" style="color: var(--text-dim)">Round Score</h2>
            <div class="text-8xl md:text-[10rem] font-black leading-none mb-12 md:mb-16 tracking-tighter" style="color: var(--text-main)" id="final-score">0</div>
            
            <button onclick="showScreen('home')" class="w-full py-6 md:py-7 font-black rounded-[30px] text-xl md:text-2xl mb-6 active:scale-95 transition-transform uppercase tracking-tighter theme-aware-btn">
                CONTINUE
            </button>
            <button onclick="shareScore()" class="w-full py-2 bg-transparent rounded-2xl font-black text-[9px] uppercase tracking-[0.25em]" style="color: var(--text-dim)">
                Share Result
            </button>
        </div>
    </div>

    <style>
        .theme-aware-btn { background: var(--text-main); color: var(--bg-color); }
    </style>

    <script>
        let categories = {};
        let currentWords = [];
        let score = 0;
        let timer = 60;
        let timerInterval;

        const toggleTheme = () => {
            document.body.classList.toggle('light-mode');
            const isLight = document.body.classList.contains('light-mode');
            document.getElementById('sun-icon').classList.toggle('hidden', !isLight);
            document.getElementById('moon-icon').classList.toggle('hidden', isLight);
            
            // Ensure background color is explicitly set on body to force transition
            document.body.style.backgroundColor = isLight ? '#f9fafb' : '#000';
            
            localStorage.setItem('theme', isLight ? 'light' : 'dark');
            renderCategories();
        };

        const loadTheme = () => {
            const saved = localStorage.getItem('theme');
            const isLight = saved === 'light';
            if (isLight) {
                document.body.classList.add('light-mode');
                document.getElementById('sun-icon').classList.remove('hidden');
                document.getElementById('moon-icon').classList.add('hidden');
                document.body.style.backgroundColor = '#f9fafb';
            } else {
                document.body.style.backgroundColor = '#000';
            }
        };

        const loadGame = async () => {
            try {
                const response = await fetch(`data/master_pack.json?t=${new Date().getTime()}`);
                if (!response.ok) throw new Error('Master pack not found');
                categories = await response.json();
                renderCategories();
            } catch (e) {
                console.error('Loading fallback content', e);
                categories = {
                    "🎬 Movies (திரைப்படங்கள்)": [["பாட்ஷா", "Baasha", "Legendary gangster movie"]],
                    "🎵 Songs (பாடல்கள்)": [["வாத்தி கமிங்", "Vaathi Coming", "Viral party anthem"]]
                };
                renderCategories();
            }
        };

        const renderCategories = () => {
            const list = document.getElementById('category-list');
            list.innerHTML = '';
            const isLight = document.body.classList.contains('light-mode');
            
            Object.keys(categories).forEach(cat => {
                const btn = document.createElement('button');
                btn.className = `w-full py-6 px-10 border rounded-[35px] text-center font-black text-xl transition-all active:scale-95 btn-active uppercase tracking-tight mb-4`;
                
                // Style based on theme variables (handled via JS for simpler button creation)
                btn.style.backgroundColor = 'var(--card-bg)';
                btn.style.borderColor = 'var(--card-border)';
                btn.style.color = 'var(--text-main)';
                
                btn.innerText = cat.split(' (')[0];
                btn.onclick = () => startGame(cat);
                list.appendChild(btn);
            });
        };

        const showScreen = (id) => {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById('screen-' + id).classList.add('active');
        };

        const updateTimerDisplay = () => {
            const pill = document.getElementById('timer-pill');
            pill.innerText = `00:${timer.toString().padStart(2, '0')}`;
            if (timer <= 10) {
                pill.style.color = '#ef4444'; // red-500
            } else {
                pill.style.color = 'var(--timer-color)';
            }
        };

        const nextWord = () => {
            if (currentWords.length === 0) { endGame(); return; }
            const [tamil, phonetic, meaning] = currentWords.pop();
            const container = document.getElementById('card-content');
            container.classList.remove('word-pop');
            void container.offsetWidth; 
            document.getElementById('word-tamil').innerText = tamil;
            document.getElementById('word-phonetic').innerText = phonetic;
            document.getElementById('word-meaning').innerText = meaning;
            container.classList.add('word-pop');
        };

        const startGame = (cat) => {
            currentWords = [...categories[cat]].sort(() => Math.random() - 0.5);
            score = 0;
            timer = 60;
            document.getElementById('game-score').innerText = score;
            nextWord();
            showScreen('game');
            startTimer();
            updateTimerDisplay(); // Reset color immediately
        };

        const flashBackground = (className) => {
            const screen = document.getElementById('screen-game');
            screen.classList.add(className);
            setTimeout(() => screen.classList.remove(className), 150);
        };

        const handleAction = (type) => {
            if (type === 'correct') {
                score++;
                document.getElementById('game-score').innerText = score;
                flashBackground('correct-bg');
                try { if (navigator.vibrate) navigator.vibrate(40); } catch(e) {}
            } else {
                flashBackground('pass-bg');
                try { if (navigator.vibrate) navigator.vibrate([20, 30, 20]); } catch(e) {}
            }
            nextWord();
        };

        const startTimer = () => {
            if (timerInterval) clearInterval(timerInterval);
            updateTimerDisplay();
            timerInterval = setInterval(() => {
                timer--;
                updateTimerDisplay();
                if (timer <= 0) endGame();
            }, 1000);
        };

        const confirmQuit = () => {
            if (confirm("End this round early?")) {
                clearInterval(timerInterval);
                showScreen('home');
            }
        };

        const endGame = () => {
            clearInterval(timerInterval);
            document.getElementById('final-score').innerText = score;
            showScreen('results');
        };

        const shareScore = () => {
            const text = `I just scored ${score} on Oru Varthai! 🎭✨`;
            if (navigator.share) navigator.share({ text: text });
        };

        loadGame();
        loadTheme();
    </script>
</body>
</html>
